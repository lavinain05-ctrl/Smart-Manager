<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="rwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#002819" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#rwaGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="108" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.25"/>

  <!-- Architectural Community Buildings -->
  <g filter="url(#rwaShadow)">
    <!-- Center Tower -->
    <polygon points="256,66 212,100 212,200 300,200 300,100" fill="#ffffff"/>
    
    <!-- Windows Center Tower -->
    <rect x="228" y="108" width="56" height="12" rx="2" fill="#047857"/>
    <rect x="228" y="132" width="56" height="12" rx="2" fill="#047857"/>
    <rect x="228" y="156" width="56" height="12" rx="2" fill="#047857"/>

    <!-- Arch Doorway -->
    <path d="M238,200 L238,178 A18,10 0 0,1 274,178 L274,200 Z" fill="#047857"/>

    <!-- Left Building -->
    <polygon points="202,114 154,140 154,200 202,200" fill="#f8fafc"/>
    <rect x="167" y="148" width="24" height="11" rx="2" fill="#047857"/>
    <rect x="167" y="170" width="24" height="11" rx="2" fill="#047857"/>

    <!-- Right Building -->
    <polygon points="310,114 358,140 358,200 310,200" fill="#f8fafc"/>
    <rect x="321" y="148" width="24" height="11" rx="2" fill="#047857"/>
    <rect x="321" y="170" width="24" height="11" rx="2" fill="#047857"/>

    <!-- Foundation line -->
    <line x1="136" y1="202" x2="376" y2="202" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- HUGE BOLD D BLOCK -->
  <text x="256" y="278" text-anchor="middle" fill="#002315" opacity="0.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4">
    D BLOCK
  </text>
  <text x="256" y="274" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="4">
    D BLOCK
  </text>

  <!-- MASSIVE RWA PILL BADGE -->
  <g filter="url(#rwaShadow)">
    <rect x="116" y="346" width="280" height="92" rx="46" fill="#ffffff"/>
    <text x="256" y="412" text-anchor="middle" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="4">
      RWA
    </text>
  </g>
</svg>