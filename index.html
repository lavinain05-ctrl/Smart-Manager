<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=10" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=10" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10" />
    <link rel="manifest" href="/manifest.json?v=10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="D Block RWA" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="D Block RWA Indraprastha — Society Management System. Manage residents, billing, garbage collection, complaints, events, and more." />
    <meta name="theme-color" content="#0f172a" />
    <title>D Block RWA Indraprastha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === "smart-manager-aad4d.web.app" || h === "smart-manager-aad4d.firebaseapp.com") {
          window.location.replace(
            "https://dblockrwaindraprastha.web.app" +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 60%, #020617 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">
        <div style="width:110px;height:110px;border-radius:28px;box-shadow:0 20px 48px rgba(0,0,0,0.5), 0 0 40px rgba(59,130,246,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:splashPulse 2s infinite ease-in-out;overflow:hidden;">
          <img src="/icon-192.png?v=10" alt="D Block RWA Indraprastha" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="font-size:26px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#ffffff;text-shadow:0 2px 12px rgba(0,0,0,0.5);">D BLOCK RWA</div>
        <div style="font-size:12px;font-weight:700;letter-spacing:4px;color:#60a5fa;text-transform:uppercase;margin-top:6px;">Indraprastha</div>
        <div style="font-size:11px;font-weight:500;letter-spacing:1px;color:#94a3b8;margin-top:4px;">Society Management System</div>

        <div id="splash-network-msg" style="display:none;margin-top:20px;font-size:11px;color:#facc15;font-weight:600;letter-spacing:0.5px;padding:6px 14px;background:rgba(250,204,21,0.12);border:1px solid rgba(250,204,21,0.25);border-radius:20px;text-align:center;">
          ⚠️ Slow network detected. Connecting to society server...
        </div>
        <button id="splash-retry-btn" onclick="window.location.reload()" style="display:none;margin-top:12px;padding:6px 16px;background:#1e3a8a;border:1px solid #3b82f6;color:#fff;border-radius:10px;font-size:11px;cursor:pointer;font-weight:700;">
          Refresh Page
        </button>

        <script>
          setTimeout(function() {
            var msg = document.getElementById('splash-network-msg');
            if (msg) msg.style.display = 'block';
          }, 3500);
          setTimeout(function() {
            var btn = document.getElementById('splash-retry-btn');
            if (btn) btn.style.display = 'inline-block';
          }, 7000);
        </script>

        <style>
          @keyframes splashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.97); }
          }
          @keyframes splashShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
