<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="D Block RWA Indraprastha — Society Management System. Manage residents, billing, garbage collection, complaints, events, and more." />
    <meta name="theme-color" content="#059669" />
    <title>D Block RWA Indraprastha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === "smart-manager-aad4d.web.app" || h === "smart-manager-aad4d.firebaseapp.com") {
          window.location.replace(
            "https://dblockrwaindraprastha.web.app" +
              window.location.pathname +
              window.location.search +
              window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:linear-gradient(145deg, #059669 0%, #047857 60%, #064e3b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:99999;">
        <img src="/icon-192.png" alt="D Block RWA" style="width:96px;height:96px;border-radius:24px;box-shadow:0 12px 28px rgba(0,0,0,0.25);margin-bottom:16px;animation:splashPulse 1.8s infinite ease-in-out;" />
        <div style="font-size:20px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;">D Block RWA</div>
        <div style="font-size:11px;font-weight:600;letter-spacing:2.5px;color:#a7f3d0;text-transform:uppercase;margin-top:5px;">Indraprastha</div>
        <style>
          @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.96); opacity: 0.88; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
